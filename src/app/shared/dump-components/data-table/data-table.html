<table class="table table-hover align-middle mb-0">
  <caption class="visually-hidden">
    {{
      legende()
    }}
  </caption>
  <thead>
    <tr class="small text-uppercase">
      @for (colonne of colonnes(); track colonne) {
        <th scope="col" class="bg-body-tertiary text-body-tertiary" [class.px-4]="$first">
          {{ colonne }}
        </th>
      }
      <th scope="col" class="px-4 bg-body-tertiary">
        <span class="visually-hidden">Actions</span>
      </th>
    </tr>
  </thead>
  <tbody>
    @for (ligne of lignes(); track $index) {
      <tr>
        @for (colonne of colonnes(); track colonne) {
          <td [class.px-4]="$first">
            @if (colonne === colonneAvatar()) {
              <div class="d-flex align-items-center gap-3">
                <app-avatar-initials [nom]="ligne[colonne]" />
                <span class="fw-semibold text-dark">{{ ligne[colonne] }}</span>
              </div>
            } @else {
              {{ ligne[colonne] }}
            }
          </td>
        }
        <td class="px-4 text-end text-nowrap">
          <app-button-smal
            symbole="✎"
            // caractere unicode &#9998;
            texte="Modifier"
            [texteMasque]="ligne[colonnes()[0]]"
            (click)="modifier.emit(ligne)"
          />
          <app-button-smal
            class="ms-2"
            symbole="✕"
            texte="Supprimer"
            [texteMasque]="ligne[colonnes()[0]]"
            (click)="supprimer.emit(ligne)"
          />
        </td>
      </tr>
    }
  </tbody>
</table>

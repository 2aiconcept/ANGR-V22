<app-list-page-layout>
  <app-page-title pageHeader sousTitre="Portefeuille commercial" titre="Entreprises" />

  <app-button-large pageHeader symbole="+" texte="nouvelle entreprise" (sender)="addEntreprise()" />

  <app-search-field
    pageToolbar
    identifiant="recherche-entreprise"
    libelle="Rechercher une entreprise"
    placeholder="Rechercher une entreprise, un secteur…"
  />

  <app-data-table legende="Liste des entreprises" [colonnes]="colonnes" [lignes]="entreprisesDeLaPage()" />

  <app-paginator
    pageFooter
    [nbElements]="entreprises().length"
    libelle="entreprises affichées"
    [pageCourante]="pageCourante()"
    [nbPages]="nbPages()"
    (changementPage)="pageCourante.set($event)"
  />
</app-list-page-layout>
